; ============================================================================
;  Firmware Arduino para ESP32-C6 - Ejemplos de FreeRTOS
; ============================================================================
;
;  IMPORTANTE - por que NO se usa la plataforma oficial "espressif32"
;  -----------------------------------------------------------------
;  A dia de hoy, el paquete oficial platform-espressif32 de PlatformIO define
;  la placa esp32-c6-devkitc-1 SOLO para el framework espidf: su core de
;  Arduino sigue en la serie 2.x, que no incluye soporte para el RISC-V del
;  ESP32-C6. Arduino sobre C6 necesita el core 3.x.
;
;  Por eso se usa el fork mantenido por la comunidad "pioarduino", que si
;  empaqueta el core Arduino 3.x con soporte de C6/C5/H2/P4. Es la via
;  habitual y recomendada hoy para Arduino en las placas ESP32 modernas.
;
;  Alternativa sin PlatformIO: Arduino IDE / arduino-cli con el core oficial
;  "esp32 by Espressif Systems" version 3.x, que si soporta el ESP32-C6.
;
;  Como compilar y flashear:
;      pio run -e ejemplo1                 (compilar)
;      pio run -e ejemplo1 -t upload       (grabar en la placa)
;      pio device monitor -b 115200        (ver la salida)
;
;  Cambie ejemplo1 por ejemplo2 ... ejemplo5 para el resto de experimentos.
; ============================================================================

[platformio]
default_envs = ejemplo1
src_dir = src

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; Los ejemplos viven fuera de firmware/ para poder compilarse tambien contra
; el kernel de FreeRTOS en el PC (carpeta simulacion/). Es EL MISMO codigo.
lib_extra_dirs = ${PROJECT_DIR}/../shared

build_flags =
    -DCORE_DEBUG_LEVEL=3
    ; GPIO del LED. En muchos DevKit del C6 el pin 8 lleva un LED RGB
    ; direccionable (WS2812) en vez de un LED simple: en ese caso conecte
    ; un LED normal con su resistencia de 220-330 ohm a este pin, tal y como
    ; advierte el material.
    -DBLINK_GPIO=8

; --- Un entorno por experimento ---------------------------------------------

[env:ejemplo1]                       ; concurrencia de tres tareas (material)
build_flags = ${env.build_flags} -DEJEMPLO=1

[env:ejemplo2]                       ; cola productor / consumidor (material)
build_flags = ${env.build_flags} -DEJEMPLO=2

[env:ejemplo3]                       ; inanicion y watchdog
build_flags = ${env.build_flags} -DEJEMPLO=3

[env:ejemplo4]                       ; preemcion por prioridad
build_flags = ${env.build_flags} -DEJEMPLO=4

[env:ejemplo5]                       ; reparto por turnos entre iguales
build_flags = ${env.build_flags} -DEJEMPLO=5
