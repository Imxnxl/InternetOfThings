; ============================================================================
;  Firmware Arduino para ESP32-C6 - Pulsador con resistencia pull-down INTERNA
; ============================================================================
;
;  El codigo fuente es UN SOLO archivo .ino, que se abre tal cual en Arduino
;  IDE (carpeta pulsador_pulldown_interno/) y que PlatformIO compila desde
;  aqui gracias a src_dir. No hay dos copias del programa.
;
;  Por que la plataforma "pioarduino" y no la oficial "espressif32"
;  -----------------------------------------------------------------
;  La plataforma oficial de PlatformIO sigue con el core de Arduino 2.x, que
;  no soporta el ESP32-C6. El fork "pioarduino" empaqueta el core 3.x, que si
;  lo soporta. (Misma decision que en la practica de multitareas.)
;
;  Como compilar y grabar:
;      pio run                              (compilar, entorno por defecto)
;      pio run -t upload                    (grabar en la placa)
;      pio device monitor                   (ver la salida a 115200 baudios)
;
;  Entornos:
;      pulldown_interno  -> la practica: INPUT_PULLDOWN            (por defecto)
;      sin_pulldown      -> experimento: entrada flotante (INPUT), para ver
;                           que pasa si NO hay ninguna resistencia pull-down
; ============================================================================

[platformio]
default_envs = pulldown_interno
src_dir = pulsador_pulldown_interno

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino

monitor_speed = 115200

; La DevKitC-1 tiene dos conectores USB-C: "USB" (nativo del chip) y "UART"
; (conversor USB-serie). Con estas dos opciones, Serial sale por el conector
; "USB", que en Windows 10/11 no necesita driver. Equivale a elegir
; "USB CDC On Boot: Enabled" en el menu Herramientas de Arduino IDE.
; USB_MODE=1 es obligatorio en el C6: su USB nativo es el periferico
; USB-Serial/JTAG (HWCDC); sin el, el core busca un USB OTG que el C6 no tiene.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:pulldown_interno]
build_flags = ${env.build_flags} -DUSAR_PULLDOWN_INTERNO=1

[env:sin_pulldown]
build_flags = ${env.build_flags} -DUSAR_PULLDOWN_INTERNO=0
