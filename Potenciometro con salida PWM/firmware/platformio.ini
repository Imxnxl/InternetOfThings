; ============================================================================
;  Firmware Arduino para ESP32-C6 - Potenciometro (ADC) -> brillo de un LED (PWM)
; ============================================================================
;
;  El codigo fuente es UN SOLO archivo .ino, que se abre tal cual en Arduino
;  IDE (carpeta potenciometro_pwm/) y que PlatformIO compila desde aqui
;  gracias a src_dir.
;
;  Se usa la plataforma "pioarduino" (core Arduino 3.x) porque la oficial de
;  PlatformIO no soporta Arduino en el ESP32-C6.
;
;  Como compilar y grabar:
;      pio run                  (compilar)
;      pio run -t upload        (grabar en la placa)
;      pio device monitor       (ver la salida a 115200 baudios)
; ============================================================================

[platformio]
default_envs = potenciometro_pwm
src_dir = potenciometro_pwm

[env:potenciometro_pwm]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino

monitor_speed = 115200

; Serial sale por el conector "UART" de la placa (conversor CH343), igual que
; con la opcion por defecto de Arduino IDE ("USB CDC On Boot: Disabled").
; Para usar el conector "USB" nativo, poner CDC_ON_BOOT=1. USB_MODE=1 es
; obligatorio en el C6 en ambos casos (su USB nativo es USB-Serial/JTAG).
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
